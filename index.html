<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nati Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one command center. Header → sport tabs → TODAY (games + today's best bets) → game page (outlook, best bets, SGP tiers, scripts, market, props, players, research, data quality). */
:root{
  --bg:#0B0E23; --panel:#141939; --panel2:#1C2250; --panel3:#232A5E; --ink:#F1F3FF; --muted:#9AA1CC; --line:#262D5E;
  --brand:#3452FF; --brand-ink:#FFFFFF; --sun:#FFD43B; --sun-ink:#14172E; --blue-soft:#1C2766; --sun-soft:#3A3413;
  --good:#2BD48A; --good-soft:#123A2E; --bad:#FF6B7A; --bad-soft:#3A1826; --warn:#FFC24D; --warn-soft:#3A2E10;
  --hot:#1F6B51; --cold:#5A2335;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:24px;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:19px;text-transform:uppercase;letter-spacing:.05em}
a{color:var(--sun)}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.btn{font:700 14px var(--f-body);border-radius:9px;padding:9px 16px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
input,select{font:14px var(--f-body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
details>summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--sun)}
details[open]>summary::before{content:"▾ "}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.logo-mark{font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(34px,7vw,48px);line-height:.9;display:flex;gap:.16em}
.logo-mark .p{color:var(--sun)}
.slogan{display:inline-block;margin-top:6px;background:var(--brand);color:#fff;font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:5px;transform:rotate(-1.2deg)}
.budget{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.budget label{font-size:12px;color:var(--muted);font-weight:600;max-width:120px;line-height:1.2}
.money{display:flex;align-items:center;gap:2px;background:var(--panel2);border:2px solid var(--brand);border-radius:9px;padding:2px 8px}
.money span{font:700 18px var(--f-mono);color:var(--sun)}
.money input{border:0;background:transparent;font:600 18px var(--f-mono);width:90px;padding:4px 0}
.money input:focus-visible{outline:none}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.06em;background:none;border:0;color:var(--muted);padding:6px 18px 8px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sun)}
.statusline{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;box-shadow:0 0 0 3px rgba(43,212,138,.2)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(255,194,77,.2)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(255,107,122,.2)}

/* pills, stars, chips */
.pill{display:inline-block;font:700 10.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.strong{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.solid{background:var(--blue-soft);color:#9DB0FF;border-color:transparent}
.pill.lean{background:var(--sun-soft);color:var(--sun);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--f-body);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}

/* avatars & logos */
.av,.logo{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font:700 12px var(--f-body);color:var(--muted)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:var(--panel3)}
.av.lg{width:84px;height:84px;font-size:22px}
.logo{border-radius:8px;background:transparent;border:0}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.logo.sm{width:26px;height:26px} .logo.lg{width:64px;height:64px}

/* section headers */
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}

/* game cards */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard.today{border-color:var(--brand)}
.gcard .tm{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.gcard .tm .rec{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.gline{display:flex;gap:12px;font:500 12.5px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.gpick{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
.gpick b{color:var(--sun)}

/* best bet cards */
.bets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.bet{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.bet .rank{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(90deg,var(--panel3),transparent);font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.bet.r1 .rank{background:linear-gradient(90deg,rgba(255,212,59,.25),transparent)}
.bet .bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pickline{display:flex;gap:12px;align-items:center}
.pickline .what{font-size:17px;font-weight:700;line-height:1.25}
.pickline .sub{font-size:12px;color:var(--muted)}
.price{font:600 20px var(--f-mono);margin-left:auto;text-align:right;white-space:nowrap}
.price small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.why{font-size:13.5px;line-height:1.5}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.nums div{background:var(--panel2);border-radius:8px;padding:6px 8px;min-width:0}
.nums b{display:block;font:600 15px var(--f-mono)}
.nums span{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.layers{display:grid;gap:4px;font-size:12.5px}
.layer{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start}
.layer .ic{font-weight:800;text-align:center;border-radius:5px;font-size:11px;padding:1px 0}
.ic.ok{background:var(--good-soft);color:var(--good)} .ic.mid{background:var(--sun-soft);color:var(--sun)} .ic.no{background:var(--bad-soft);color:var(--bad)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sizes div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.sizes span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sizes b{font:600 15px var(--f-mono)}
.sizes div:nth-child(2){border-color:var(--brand)}
.flag{font-size:12px;color:var(--warn)}

/* SGP */
.sgps{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.sgp{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sgp header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sgp.t1 header{background:linear-gradient(90deg,var(--good-soft),transparent)}
.sgp.t2 header{background:linear-gradient(90deg,var(--blue-soft),transparent)}
.sgp.t3 header{background:linear-gradient(90deg,var(--sun-soft),transparent)}
.sgp .bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.thesis{font-size:13.5px;border-left:3px solid var(--sun);padding-left:10px}
.legs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legs li{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:8px 10px}
.legs .lg{flex:1;min-width:0}
.legs .lgtop{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.legs .lgwhy{font-size:12.5px;color:var(--muted);margin-top:2px}
.bign{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bign b{display:block;font:600 21px var(--f-mono)}
.bign span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* game page */
.gamehead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.gamehead .mid{text-align:center;min-width:0}
.gamehead .mid .vs{font-family:var(--f-display);font-size:clamp(22px,4.5vw,34px);font-weight:800;line-height:1.05}
.gamehead .side{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;font-size:12px;color:var(--muted)}
.outlook{font-size:15px;line-height:1.6}
.market{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.mk{background:var(--panel2);border-radius:10px;padding:10px 12px}
.mk b{display:block;font:600 18px var(--f-mono)}
.mk .mv{font-size:12px;color:var(--muted)}
.scripts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.script{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.script ul{margin:0;padding-left:18px;font-size:13px}
.navjump{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.navjump a{white-space:nowrap;flex:0 0 auto;font:600 12.5px var(--f-body);color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:99px;background:var(--panel)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--panel2)}
td.num,th.num{text-align:right;font-family:var(--f-mono)}
td.hot{background:var(--hot);font-weight:700} td.cold{background:var(--cold)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.pl{display:flex;align-items:center;gap:10px}
.inj{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.inj ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.dq li{margin-bottom:4px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--sun);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

/* player drawer */
.drawer{position:fixed;inset:0;background:rgba(5,7,20,.7);z-index:20;display:flex;justify-content:flex-end}
.drawer .pane{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.phead{display:flex;gap:14px;align-items:center}
.phead .nm{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.chart{width:100%;height:auto;display:block}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:640px){.nums{grid-template-columns:repeat(2,1fr)} .gamehead{grid-template-columns:1fr} .gamehead .side{flex-direction:row;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="logo-mark"><span>Nati</span><span class="p">Picks</span></div><span class="slogan">Beat the books at their own math.</span></div>
    <div class="budget"><label for="bankroll">Your betting budget</label><div class="money"><span>$</span><input id="bankroll" type="number" min="1" step="1" value="1000" inputmode="numeric"></div></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-sport="nfl" aria-selected="true">NFL</button>
    <button class="tab" role="tab" data-sport="nba" aria-selected="false">NBA</button>
    <button class="tab" role="tab" data-sport="soccer" aria-selected="false">Soccer</button>
  </div>
  <div class="statusline" id="statusline"></div>
  <main id="main" class="stack"></main>
  <p class="foot">Nati Picks does the research; you make the call. No bet is a lock. Only bet what you can afford to lose. Problem gambling help: 1-800-GAMBLER.</p>
</div>
<div class="drawer" id="drawer" hidden><div class="pane" id="pane" role="dialog" aria-modal="true" aria-label="Player details"></div></div>
<script>
'use strict';
/* ============================ UTILITIES ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ try { for (const key of Object.keys(localStorage)) if (key.startsWith('np_log_')) localStorage.removeItem(key); localStorage.setItem(k, JSON.stringify(v)); } catch(e2){} } }
};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt1 = x => (Math.round(x*10)/10).toFixed(1).replace(/\.0$/, '');
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;
const etDate = t => new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t));
const timeET = t => new Date(t).toLocaleString([], { weekday:'short', hour:'numeric', minute:'2-digit' });
const clock = t => new Date(t).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
/* ============================ MATH ============================ */
function normCdf(x){
  const t = 1/(1+0.2316419*Math.abs(x)), d = 0.3989422804014327*Math.exp(-x*x/2);
  const p = d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return x > 0 ? 1-p : p;
}
function normInv(p){
  if (p <= 0) return -9; if (p >= 1) return 9;
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239];
  const b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572];
  const c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425; let q, r;
  if (p < pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if (p > 1-pl){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
const amToDec = a => a > 0 ? 1 + a/100 : 1 + 100/(-a);
const decToAm = d => d >= 2 ? '+' + Math.round((d-1)*100) : '-' + Math.round(100/(d-1));
const pct = (x, dp=1) => (x*100).toFixed(dp) + '%';
const sPct = x => (x >= 0 ? '+' : '') + (x*100).toFixed(1) + '%';
const money = x => '$' + (x >= 100 ? Math.round(x).toLocaleString() : x.toFixed(2));
function median(arr){ const a=[...arr].sort((x,y)=>x-y); const n=a.length; return n ? (n%2 ? a[(n-1)/2] : (a[n/2-1]+a[n/2])/2) : NaN; }
function fmtPt(p){ return p > 0 ? '+' + p : String(p); }

/* Power de-vig: removes the book's margin, shaving longshots more than favorites. */
function powerDevig(q1, q2){
  if (q1 + q2 <= 1) return q1/(q1+q2);
  let lo=1, hi=30;
  for (let i=0;i<60;i++){ const k=(lo+hi)/2; if (Math.pow(q1,k)+Math.pow(q2,k) > 1) lo=k; else hi=k; }
  return Math.pow(q1,(lo+hi)/2);
}

/* Discrete distributions over whole numbers (scores, yards, points all land on integers). */
function finishPmf(lo, arr){
  let s=0; for (const v of arr) s+=v; if (s<=0) s=1;
  const n=arr.length, pmf=new Float64Array(n), cum=new Float64Array(n); let c=0;
  for (let i=0;i<n;i++){ pmf[i]=arr[i]/s; c+=pmf[i]; cum[i]=c; }
  return { lo, hi: lo+n-1, pmf, cum };
}
function cdfAt(d, x){ if (x < d.lo) return 0; if (x >= d.hi) return 1; return d.cum[x-d.lo]; }

  try { D = await loadDetail(g); } catch(e){ D = { injuries:{}, lastFive:{}, news:[], odds:null }; dq.push({ lvl:'bad', t:'Game details (injuries, recent form, line history) could not be loaded. Using odds only.' }); }
  if (!D.odds || D.odds.homeSpread == null && D.odds.homeML == null) D.odds = g.odds || D.odds;
  if (!D.odds) dq.push({ lvl:'bad', t:'No sportsbook lines were found for this game in the free feed yet.' });
  const gm = gameModel(g, D);
  let rosters = { home:{}, away:{} }, props = { list:[] };
  if (sport !== 'soccer'){
    onStep('Loading rosters and player prop lines…');
    const [rh, ra, pp] = await Promise.all([ loadRoster(sport, g.home).catch(()=>null), loadRoster(sport, g.away).catch(()=>null), loadProps(g).catch(()=>null) ]);
    if (!rh || !ra) dq.push({ lvl:'warn', t:'A team roster could not be loaded, so some players are missing photos or positions.' });
    rosters = { home:rh||{}, away:ra||{} };
    if (!pp) dq.push({ lvl:'warn', t:'Player prop lines could not be loaded. Showing game lines only.' });
    props = pp || { list:[] };
  }
  const idx = {}; for (const side of ['home','away']) for (const [id, p] of Object.entries(rosters[side])) idx[id] = { player:p, side };
  const plist = props.list.filter(x => idx[x.athleteId]);
  const missingPlayers = props.list.length - plist.length;
  const ids = [...new Set(plist.map(x=>x.athleteId))];
  onStep(`Pulling game logs for ${plural(ids.length,'player')}…`);
  const logsArr = await pool(ids, 6, id => loadLog(sport, id));
  const logs = {}; ids.forEach((id,i) => logs[id] = logsArr[i] || []);
  onStep('Running the model and checking the context…');
  const lines = lineCandidates(g, gm, D).map(c => scoreLine(c, g, gm, D));
  const propCands = [], skipped = [];
  for (const pr of plist){
    const { player, side } = idx[pr.athleteId];
    const inj = (D.injuries[side] || []).find(x => x.id === player.id);
    if (inj && OUT_STATUSES.test(inj.status)){ skipped.push(`${player.name} (${inj.status})`); continue; }
    const cs = propCandidate(g, gm, D, pr, player, side, logs[pr.athleteId] || []); if (cs) propCands.push(...cs);
  }
  const tds = [];
  if (sport === 'nfl') for (const id of ids){ const { player, side } = idx[id]; const inj = (D.injuries[side]||[]).find(x=>x.id===id); if (inj && OUT_STATUSES.test(inj.status)) continue; const t = tdCandidate(g, gm, D, player, side, logs[id]||[]); if (t) tds.push(t); }
  tds.sort((a,b)=>(b.path-a.path) || (b.p-a.p));
  for (const c of [...lines, ...propCands]) c.whyText = c.kind==='player' ? propWhy(c, g, gm) : lineWhy(c, g, gm, D);
  const all = [...lines, ...propCands.filter(c => c.n > 0 || c.quality > 0.5)];
  const best = rankBets(all);
  const sgps = buildSGPs(g, gm, all);
  // data quality
  if (props.provider) dq.push({ lvl:'ok', t:`${plural(plist.length,'player prop line')} from ${props.provider}${props.updated?`, last changed ${clock(props.updated)}`:''}.` });
  if (sport !== 'soccer' && plist.length) dq.push({ lvl:'warn', t:'Player prop prices (the -110 part) are not in the free feed. Props are rated at a standard -110; check your book\'s price before betting.' });
  if (sport === 'soccer') dq.push({ lvl:'warn', t:'Soccer player props are not in the free feed. Recommendations use match result and goals lines only.' });
  if (missingPlayers > 0) dq.push({ lvl:'warn', t:`${plural(missingPlayers,'prop line')} skipped because the player wasn't on the current roster.` });
  if (skipped.length) dq.push({ lvl:'ok', t:`Removed props for players ruled out: ${skipped.slice(0,6).join(', ')}${skipped.length>6?'…':''}.` });
  const thin = propCands.filter(c => c.side==='over' && c.n < 3).map(c=>c.player.name); if (thin.length) dq.push({ lvl:'warn', t:`Thin sample (under 3 games): ${[...new Set(thin)].slice(0,6).join(', ')}.` });
  if (D.injuries && (D.injuries.home || D.injuries.away)) dq.push({ lvl:'ok', t:'Injury report loaded from ESPN.' }); else if (sport!=='soccer') dq.push({ lvl:'warn', t:'No injury report found yet for this game.' });
  if (sport === 'nfl') dq.push({ lvl:'warn', t:'Starters are unconfirmed until inactives are posted about 90 minutes before kickoff.' });
  if (sport === 'nfl') dq.push({ lvl:'warn', t:'Not available from free sources: snap %, routes run, red-zone and goal-line usage, anytime TD prices, kicking and defensive props. Their slots are ready for a data source.' });
  if (g.state === 'in') dq.push({ lvl:'warn', t:'This game is in progress. Pre-game lines may be stale.' });
  if (SRC.proxy) dq.push({ lvl:'warn', t:'Some data came through a backup connection because ESPN blocked a direct request.' });
  const res = { at:Date.now(), g, D, gm, lines, props:propCands, tds, best, sgps, dq, logs, idx, provider:props.provider, updated:props.updated, all };
  res.outlook = outlookText(res);
  CACHE[g.id] = res;
  return res;
}

/* ============================ PLAIN-ENGLISH EXPLANATIONS ============================ */
function propWhy(c, g, gm){
  const S = [], st = c.market.toLowerCase(), sideW = c.side, sn = SCRIPT_NAME(gm, g);
  if (c.h10 && c.h10.n >= 3) S.push(`${c.player.name} has gone ${sideW} ${c.line} ${st} in ${c.h10.h} of his last ${c.h10.n} games${c.seasonAvg!=null?`, averaging ${fmt1(c.seasonAvg)}`:''}.`);
  else if (c.n) S.push(`${c.player.name} has only ${plural(c.n,'game')} on record, averaging ${fmt1(c.seasonAvg)}.`);
  else S.push(`There's no game log for ${c.player.name} yet, so this leans on the betting line.`);
  if (c.last3 != null && c.seasonAvg){ const r = c.last3/c.seasonAvg; if (r > 1.12) S.push(`He's trending up, with ${fmt1(c.last3)} a game over his last three.`); else if (r < 0.88) S.push(`He's trending down, with ${fmt1(c.last3)} a game over his last three.`); }
  if (/^(receptions|reception_yds)$/.test(c.stat) && c.usage.targets != null) S.push(`He's seeing ${fmt1(c.usage.targets)} targets a game.`);
  if (/^rush_/.test(c.stat) && c.usage.carries != null) S.push(`He's getting ${fmt1(c.usage.carries)} carries a game.`);
  if (/^pass_/.test(c.stat) && c.usage.passAtt != null) S.push(`He's throwing ${fmt1(c.usage.passAtt)} passes a game.`);
  if (c.usage.minutes != null && g.sport==='nba') S.push(`He's playing ${fmt1(c.usage.minutes)} minutes a night.`);
  S.push(...c.why);
  const ord = Object.entries(gm.scripts).sort((a,b)=>b[1]-a[1]);
  const fitS = ord.find(([s]) => c.align[s] > 0), badTop = c.align[ord[0][0]] < 0;
  if (fitS) S.push(`It fits the "${sn[fitS[0]].title}" script (${pct(fitS[1],0)} likely).`);
  if (badTop) S.push(`Risk: it cuts against our most likely script, "${sn[ord[0][0]].title}".`);
  if (c.open != null && c.open !== c.line){ const agree = (c.line > c.open) === (c.side==='over'); S.push(`The line moved from ${c.open} to ${c.line} since it opened, ${agree ? 'so the market is moving this way' : 'against this side, so you get a better number than the opener'}.`); }
  S.push(`Our model projects ${fmt1(c.proj)} and gives the ${sideW} a ${pct(c.p,0)} chance.`);
  if (c.roleNote) S.push(`Caution: ${c.roleNote}.`);
  if (c.mathOnly) S.push('The math likes this more than his real-world usage does, so it is rated down.');
  return S.join(' ');
}
function lineWhy(c, g, gm, D){
  const S = [], o = gm.odds;

    const fav = g[gm.favSide].short, team = c.team ? g[c.team] : null, opp = c.team ? g[c.team==='home'?'away':'home'] : null;
    S.push(`Our model has ${gm.mu >= 0 ? g.home.short : g.away.short} by ${fmt1(Math.abs(gm.mu))}; the betting market says ${gm.muMkt >= 0 ? g.home.short : g.away.short} by ${fmt1(Math.abs(gm.muMkt))}.`);
    if (team && opp){ const outOpp = notableOut(D, c.team==='home'?'away':'home'); if (outOpp.length) S.push(`${opp.short} will be without ${outOpp.slice(0,3).map(x=>`${x.pos} ${x.name}`).join(', ')}.`);
      const outOwn = notableOut(D, c.team); if (outOwn.length) S.push(`${team.short} are missing ${outOwn.slice(0,3).map(x=>`${x.pos} ${x.name}`).join(', ')}.`); }
    if (gm.formMargin != null){ const lf = D.lastFive; const d = side => { const a = lf[side]; return a.reduce((t,e)=>t+e.pf-e.pa,0)/a.length; };
      S.push(`Recent form: ${g.home.short} ${d('home')>=0?'+':''}${fmt1(d('home'))} points a game over their last ${lf.home.length}, ${g.away.short} ${d('away')>=0?'+':''}${fmt1(d('away'))}.`); }
    if (D.predictor && team) S.push(`ESPN's power index gives ${team.short} a ${pct(c.team==='home'?D.predictor.home:D.predictor.away,0)} chance to win.`);
    if (c.open != null && c.line != null && c.open !== c.line) S.push(`This line opened at ${fmtPt(c.open)} and is now ${fmtPt(c.line)}${(Math.abs(c.line) < Math.abs(c.open)) === (c.line<0) ? '' : ''}.`);
  } else if (c.kind === 'margin'){
    S.push(`From the prices, we expect ${g.home.short} ${fmt1(gm.lh)} goals and ${g.away.short} ${fmt1(gm.la)}.`);
  }
  if (c.kind === 'total'){
    S.push(`We expect about ${fmt1(gm.muT)} total ${g.sport==='soccer'?'goals':'points'} against a line of ${c.line}.`);
    if (gm.formTotal != null) S.push(`These teams' recent games have averaged ${fmt1(gm.formTotal)} combined points.`);
    if (gm.wx && gm.wxAdj) S.push(`Weather matters here${gm.wx.gust?`: gusts near ${gm.wx.gust} mph`:''}${gm.wx.rain?`, ${gm.wx.rain}% chance of rain`:''}, which takes about ${fmt1(-gm.wxAdj)} points off.`);
    if (c.open != null && c.open !== c.line) S.push(`The total opened at ${c.open} and has moved to ${c.line}.`);

function outlookText(res){

    const sp = Math.abs(o.homeSpread);
    S.push(sp === 0 ? `It's a pick'em between the ${g.away.name} and the ${g.home.name}.` : `The ${fav.name} are ${fmt1(sp)}-point favorites${gm.favSide==='away'?' on the road':' at home'} against the ${dog.name}.`);
    if (o.total != null && gm.implied.home != null) S.push(`The total of ${o.total} points to roughly ${g.home.short} ${fmt1(gm.implied.home)}, ${g.away.short} ${fmt1(gm.implied.away)}.`);
    if (o.homeSpreadOpen != null && o.homeSpreadOpen !== o.homeSpread) S.push(`The spread has moved from ${fmtPt(o.homeSpreadOpen)} to ${fmtPt(o.homeSpread)} (${g.home.short}) since it opened.`);
    if (o.totalOpen != null && o.totalOpen !== o.total) S.push(`The total has moved from ${o.totalOpen} to ${o.total}.`);
  } else if (g.sport === 'soccer') {
    S.push(gm.ok ? `${fav.name} are favored. The prices point to about ${fmt1(gm.lh)}–${fmt1(gm.la)} in expected goals.` : 'Prices for this match are not posted yet.');
  }
  const outs = ['home','away'].flatMap(s => notableOut(D, s).slice(0,2).map(x=>`${g[s].short} ${x.pos} ${x.name}`));
  if (outs.length) S.push(`Notable absences: ${outs.join(', ')}.`);
  if (gm.wx && gm.wxAdj) S.push(`Weather could slow scoring${gm.wx.gust?` (gusts near ${gm.wx.gust} mph)`:''}.`);
  const top = Object.entries(gm.scripts).sort((a,b)=>b[1]-a[1])[0];
  S.push(`Most likely script: "${sn[top[0]].title}" (${pct(top[1],0)}).`);
  return S.join(' ');
}

function sparkChart(vals, line, labels){
  const v = vals.slice(0,10).reverse(), lb = labels.slice(0,10).reverse(); if (!v.length) return '';
  const W = 460, H = 150, pad = 26, max = Math.max(line*1.4, ...v) || 1, bw = (W - pad*2)/v.length;
  const y = x => H - 22 - (x/max)*(H-40);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recent games vs the line">
    ${v.map((x,i)=>`<rect x="${pad+i*bw+4}" y="${y(x)}" width="${bw-8}" height="${Math.max(1,H-22-y(x))}" rx="3" fill="${x>line?'#2BD48A':'#5A6290'}"/><text x="${pad+i*bw+bw/2}" y="${y(x)-4}" fill="#F1F3FF" font-size="11" text-anchor="middle" font-family="IBM Plex Mono, monospace">${fmt1(x)}</text><text x="${pad+i*bw+bw/2}" y="${H-6}" fill="#9AA1CC" font-size="10" text-anchor="middle">${esc(lb[i]||'')}</text>`).join('')}
    <line x1="${pad}" x2="${W-pad}" y1="${y(line)}" y2="${y(line)}" stroke="#FFD43B" stroke-dasharray="5 4" stroke-width="2"/><text x="${W-pad}" y="${y(line)-5}" fill="#FFD43B" font-size="11" text-anchor="end">Line ${line}</text></svg>`;
}

    </div></div>
    <div class="stack"><span class="lbl">Recent form (last 5)</span><div class="tablewrap"><table><thead><tr><th>Game</th>${statsShown.map(([,l])=>`<th class="num">${l}</th>`).join('')}</tr></thead><tbody>
      ${games.slice(0,5).map(x=>`<tr><td>${esc(x.atVs)} ${esc(x.opp)} <span class="note">${esc(x.result)}${x.season==='last season'?' · last season':''}</span></td>${statsShown.map(([s])=>{ const v = logVal(sport,x,s); return `<td class="num">${v==null?'—':fmt1(v)}</td>`; }).join('')}</tr>`).join('') || `<tr><td colspan="${statsShown.length+1}" class="note">No games logged yet.</td></tr>`}</tbody></table></div></div>
    <div class="stack"><span class="lbl">Season averages (${thisSeason.length ? 'this season, '+plural(thisSeason.length,'game') : 'last season'})</span><div class="grid2">${statsShown.map(([s,l])=>`<div class="mk"><span class="lbl">${l}</span><b>${avg(s, thisSeason.length ? thisSeason : games)}</b></div>`).join('')}</div></div>`;
  $('#drawer').hidden = false; $('#closeP').onclick = closePlayer; $('#closeP').focus();
}
function closePlayer(){ $('#drawer').hidden = true; }

/* ---------- flow ---------- */
async function loadSport(force){
  state.busy = true; setStatus();
  if (!location.hash.startsWith('#g-')) renderDashboard();
  try { state.slate = await loadSlate(state.sport); state.loadedAt = Date.now(); }
  catch(e){ state.slate = []; $('#main').innerHTML = `<div class="panel" style="color:var(--bad)">Couldn't load ${CFG[state.sport].label} games from ESPN (${esc(e.message)}). Check your connection and reload.</div>`; state.busy = false; setStatus(); return; }
  setStatus();
  route();
  const { day } = dayGroups();
  for (const g of day){ if (g.state === 'post') continue; try { await analyzeGame(g, force); } catch(e){} if (!location.hash.startsWith('#g-')) renderDashboard(); }
  state.busy = false; setStatus();
  if (!location.hash.startsWith('#g-')) renderDashboard();
}
function route(){
  closePlayer();
  const h = location.hash;
  if (h.startsWith('#g-')) renderGame(h.slice(3)); else renderDashboard();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  state.sport = t.dataset.sport; store.set('np_sport', state.sport);
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x===t)));
  if (location.hash) history.replaceState(null, '', location.pathname);
  state.slate = []; loadSport(false);
});
window.addEventListener('hashchange', () => { if (/^#s-/.test(location.hash)) return; route(); if (location.hash.startsWith('#g-')) window.scrollTo({ top:0 }); });
document.addEventListener('click', e => {
  const pl = e.target.closest('[data-player]'); if (pl){ openPlayer(pl.dataset.game, pl.dataset.player); return; }
  if (e.target.id === 'drawer') closePlayer();
  const a = e.target.closest('.navjump a'); if (a){ e.preventDefault(); const t = document.querySelector(a.getAttribute('href')); if (t) t.scrollIntoView({ behavior:'smooth', block:'start' }); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });
$('#bankroll').value = store.get('np_bank', '1000');
$('#bankroll').oninput = () => { store.set('np_bank', $('#bankroll').value); route(); };
document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x.dataset.sport===state.sport)));
setInterval(() => { for (const k of Object.keys(CACHE)) delete CACHE[k]; MEM.clear(); loadSport(true); }, 5*60*1000);
loadSport(false);
</script>
</body>
