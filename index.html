<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nati Picks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23FFD43B%22/%3E%3Cg%20fill%3D%22%2314172E%22%20transform%3D%22translate%283.5%200%29%20skewX%28-9%29%22%3E%3Cpath%20d%3D%22M12%2046V18h6.8l9.6%2015.4V18h6v28h-6.6L18%2030.4V46z%22/%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M38.5%2046V18h10.2c6%200%209.6%203.6%209.6%208.8s-3.6%208.9-9.6%208.9h-4.2V46zM44.5%2023.2v7.3h3.9c2.5%200%203.9-1.4%203.9-3.65s-1.4-3.65-3.9-3.65z%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one command center. Header → sport tabs → TODAY (games + today's best bets) → game page (outlook, best bets, SGP tiers, scripts, market, props, players, research, data quality). */
:root{
  --bg:#0B0E23; --panel:#141939; --panel2:#1C2250; --panel3:#232A5E; --ink:#F1F3FF; --muted:#9AA1CC; --line:#262D5E;
  --brand:#3452FF; --brand-ink:#FFFFFF; --sun:#FFD43B; --sun-ink:#14172E; --blue-soft:#1C2766; --sun-soft:#3A3413;
  --good:#2BD48A; --good-soft:#123A2E; --bad:#FF6B7A; --bad-soft:#3A1826; --warn:#FFC24D; --warn-soft:#3A2E10;
  --hot:#1F6B51; --cold:#5A2335;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:24px;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:19px;text-transform:uppercase;letter-spacing:.05em}
a{color:var(--sun)}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.btn{font:700 14px var(--f-body);border-radius:9px;padding:9px 16px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
input,select{font:14px var(--f-body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
details>summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--sun)}
details[open]>summary::before{content:"▾ "}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.logo-mark{font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(34px,7vw,48px);line-height:.9;display:flex;gap:.16em}
.logo-mark .p{color:var(--sun)}
.slogan{display:inline-block;margin-top:6px;background:var(--brand);color:#fff;font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:5px;transform:rotate(-1.2deg)}
.budget{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.budget label{font-size:12px;color:var(--muted);font-weight:600;max-width:120px;line-height:1.2}
.money{display:flex;align-items:center;gap:2px;background:var(--panel2);border:2px solid var(--brand);border-radius:9px;padding:2px 8px}
.money span{font:700 18px var(--f-mono);color:var(--sun)}
.money input{border:0;background:transparent;font:600 18px var(--f-mono);width:90px;padding:4px 0}
.money input:focus-visible{outline:none}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.06em;background:none;border:0;color:var(--muted);padding:6px 18px 8px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sun)}
.statusline{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;box-shadow:0 0 0 3px rgba(43,212,138,.2)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(255,194,77,.2)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(255,107,122,.2)}

/* pills, stars, chips */
.pill{display:inline-block;font:700 10.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.strong{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.solid{background:var(--blue-soft);color:#9DB0FF;border-color:transparent}
.pill.lean{background:var(--sun-soft);color:var(--sun);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--f-body);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}

/* avatars & logos */
.av,.logo{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font:700 12px var(--f-body);color:var(--muted)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:var(--panel3)}
.av.lg{width:84px;height:84px;font-size:22px}
.logo{border-radius:8px;background:transparent;border:0}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.logo.sm{width:26px;height:26px} .logo.lg{width:64px;height:64px}

/* section headers */
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}

/* game cards */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard.today{border-color:var(--brand)}
.gcard .tm{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.gcard .tm .rec{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.gline{display:flex;gap:12px;font:500 12.5px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.gpick{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
.gpick b{color:var(--sun)}

/* best bet cards */
.bets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bet{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.bet .rank{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(90deg,var(--panel3),transparent);font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.bet.r1 .rank{background:linear-gradient(90deg,rgba(255,212,59,.25),transparent)}
.bet .bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pickline{display:flex;gap:12px;align-items:center}
.pickline .what{font-size:17px;font-weight:700;line-height:1.25}
.pickline .sub{font-size:12px;color:var(--muted)}
.price{font:600 20px var(--f-mono);margin-left:auto;text-align:right;white-space:nowrap}
.price small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.why{font-size:13.5px;line-height:1.5}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.nums div{background:var(--panel2);border-radius:8px;padding:6px 8px;min-width:0}
.nums b{display:block;font:600 15px var(--f-mono)}
.nums span{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.layers{display:grid;gap:4px;font-size:12.5px}
.layer{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start}
.layer .ic{font-weight:800;text-align:center;border-radius:5px;font-size:11px;padding:1px 0}
.ic.ok{background:var(--good-soft);color:var(--good)} .ic.mid{background:var(--sun-soft);color:var(--sun)} .ic.no{background:var(--bad-soft);color:var(--bad)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sizes div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.sizes span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sizes b{font:600 15px var(--f-mono)}
.sizes div:nth-child(2){border-color:var(--brand)}
.flag{font-size:12px;color:var(--warn)}

/* SGP */
.sgps{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.sgp{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sgp header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sgp.t1 header{background:linear-gradient(90deg,var(--good-soft),transparent)}
.sgp.t2 header{background:linear-gradient(90deg,var(--blue-soft),transparent)}
.sgp.t3 header{background:linear-gradient(90deg,var(--sun-soft),transparent)}
.sgp .bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.thesis{font-size:13.5px;border-left:3px solid var(--sun);padding-left:10px}
.legs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legs li{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:8px 10px}
.legs .lg{flex:1;min-width:0}
.legs .lgtop{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.legs .lgwhy{font-size:12.5px;color:var(--muted);margin-top:2px}
.bign{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bign b{display:block;font:600 21px var(--f-mono)}
.bign span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* game page */
.gamehead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.gamehead .mid{text-align:center;min-width:0}
.gamehead .mid .vs{font-family:var(--f-display);font-size:clamp(22px,4.5vw,34px);font-weight:800;line-height:1.05}
.gamehead .side{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;font-size:12px;color:var(--muted)}
.outlook{font-size:15px;line-height:1.6}
.market{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.mk{background:var(--panel2);border-radius:10px;padding:10px 12px}
.mk b{display:block;font:600 18px var(--f-mono)}
.mk .mv{font-size:12px;color:var(--muted)}
.scripts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.script{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.script ul{margin:0;padding-left:18px;font-size:13px}
.navjump{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.navjump a{font:600 12.5px var(--f-body);color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:99px;background:var(--panel)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--panel2)}
td.num,th.num{text-align:right;font-family:var(--f-mono)}
td.hot{background:var(--hot);font-weight:700} td.cold{background:var(--cold)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.pl{display:flex;align-items:center;gap:10px}
.inj{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.inj ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.dq li{margin-bottom:4px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--sun);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

/* player drawer */
.drawer{position:fixed;inset:0;background:rgba(5,7,20,.7);z-index:20;display:flex;justify-content:flex-end}
.drawer .pane{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.phead{display:flex;gap:14px;align-items:center}
.phead .nm{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.chart{width:100%;height:auto;display:block}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:640px){.nums{grid-template-columns:repeat(2,1fr)} .gamehead{grid-template-columns:1fr} .gamehead .side{flex-direction:row;justify-content:center}}
.btn.sm{padding:6px 11px;font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters select,.filters input{font-size:13px;padding:7px 9px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(560px,calc(100% - 32px));background:var(--panel3);border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.warn{border-left-color:var(--warn)} .toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--good)}
.ladders{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
tr.bestrow td{background:var(--good-soft)}
.tierh{padding:6px 12px;border-radius:8px;align-self:flex-start}
.tierh.t1{background:var(--good-soft)} .tierh.t2{background:var(--blue-soft)} .tierh.t3{background:var(--sun-soft)}
.small{font-size:13px} ul.small{margin:4px 0 0;padding-left:18px}
.outlookrow{display:block;text-decoration:none;color:var(--ink)} .outlookrow:hover{border-color:var(--brand)}
.statusline{justify-content:space-between}
.msg{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);border:1px solid var(--line)}
@media (max-width:640px){.ladders{grid-template-columns:minmax(0,1fr)}}
.sgps,.bets{align-items:start}

/* ===== v4 presentation layer: simple first, depth on demand ===== */
.wrap{padding-block:14px 40px;gap:14px}
h2{font-size:21px} h3{font-size:16px}
.sec{gap:10px}
.sechead{align-items:center}

/* header (sticky): logo · main tabs · settings / sport + time filters */
.hdr{position:sticky;top:0;z-index:15;background:rgba(11,14,35,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:1180px;margin:0 auto;padding:8px 16px 0;display:flex;flex-direction:column;gap:6px}
.hdr-r1{display:flex;align-items:center;gap:18px;min-height:46px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:0 0 auto}
.np-logo{width:38px;height:38px;flex:0 0 auto;display:block}
.brand-t{display:flex;flex-direction:column;line-height:1.05}
.bn{font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:24px;letter-spacing:.02em}
.bn .p{color:var(--sun)}
.tagline{display:inline-block;align-self:flex-start;margin-top:4px;background:var(--brand);color:#fff;font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:5px;transform:rotate(-1.2deg);white-space:nowrap}
.slogan-m{display:none}
.mainnav{display:flex;gap:4px;margin-left:8px;align-self:stretch}
.mainnav a{display:flex;align-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:0 12px;border-bottom:3px solid transparent;white-space:nowrap}
.mainnav a:hover{color:var(--ink)}
.mainnav a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--sun)}
.iconbtn{margin-left:auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer;flex:0 0 auto}
.hdr-r2{display:flex;align-items:center;gap:10px;padding:6px 0 8px;overflow-x:auto;scrollbar-width:none}
.hdr-r2::-webkit-scrollbar{display:none}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;flex:0 0 auto}
.seg button{font:700 12.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:none;border:0;border-radius:7px;padding:0 11px;min-height:32px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.upd{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto;display:flex;align-items:center}
.linkbtn{background:none;border:0;color:var(--sun);font:600 13px var(--f-body);cursor:pointer;padding:6px 2px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}

/* THE standard drill-down button (WHY? · DEEP RESEARCH · VIEW · OTHER OPTIONS · SHOW MORE · VIEW BETS) */
.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--sun);background:var(--sun);color:var(--sun-ink);
  font:800 13px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;transition:filter .12s, transform .06s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:translateY(1px);filter:brightness(.92)}
.go[aria-expanded="true"]{background:transparent;color:var(--sun)}
.go:focus-visible{outline:2px solid #fff;outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ============================ LOCAL DATABASE (IndexedDB): odds history, events, health, jobs ============================ */
const DB = (() => {
  let dbp = null, mem = { odds:new Map(), events:new Map(), meta:new Map() };
  const open = () => dbp || (dbp = new Promise((res) => { try { const r = indexedDB.open('natipicks', 1);
    r.onupgradeneeded = () => { const d = r.result; for (const s of ['odds','events','meta']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch(e){ res(null); } }));
  const tx = async (store, mode, fn) => { const d = await open(); if (!d) return fn(null); return new Promise(res => { try { const t = d.transaction(store, mode), s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out); t.onerror = () => res(null); } catch(e){ res(null); } }); };
  const get = async (store, key) => { const d = await open(); if (!d) return mem[store].get(key); return new Promise(res => { try { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); } catch(e){ res(undefined); } }); };
  const put = (store, key, val) => { mem[store].set(key, val); return tx(store, 'readwrite', s => s && s.put(val, key)); };
  const all = async store => { const d = await open(); if (!d) return [...mem[store].entries()]; return new Promise(res => { try { const s = d.transaction(store).objectStore(store), out = []; const r = s.openCursor(); r.onsuccess = () => { const c = r.result; if (c){ out.push([c.key, c.value]); c.continue(); } else res(out); }; r.onerror = () => res(out); } catch(e){ res([]); } }); };
  const del = (store, key) => { mem[store].delete(key); return tx(store, 'readwrite', s => s && s.delete(key)); };
  const count = async store => { const d = await open(); if (!d) return mem[store].size; return new Promise(res => { try { const r = d.transaction(store).objectStore(store).count(); r.onsuccess = () => res(r.result); r.onerror = () => res(0); } catch(e){ res(0); } }); };
  return { get, put, all, del, count, ok: async () => !!(await open()) };
})();
/* Historical odds: open, previous, current, high, low and a timeline per book/market/selection. */
async function recordOdds(g, offers){
  const now = Date.now();
  for (const o of offers){
    if (o.price == null && o.line == null) continue;
    const ent = o.playerId || o.playerName || o.team || '';
    const key = `${g.id}|${o.book}|${o.period||'FG'}|${o.market}|${ent}|${o.side}|${o.isAlt ? o.line : ''}`;
    const h = (await DB.get('odds', key)) || { key, gid:g.id, sport:g.sport, book:o.book, market:o.market, side:o.side, entity:ent, open:{ line:o.line, price:o.price, t:now }, hist:[], hi:null, lo:null };
    const last = h.hist[h.hist.length-1];
    if (!last || last.line !== o.line || last.price !== o.price){ h.prev = last || null; h.hist.push({ t:now, line:o.line, price:o.price }); if (h.hist.length > 60) h.hist.splice(1, 1); }
    h.cur = { line:o.line, price:o.price, t:now }; if (o.line != null){ h.hi = h.hi == null ? o.line : Math.max(h.hi, o.line); h.lo = h.lo == null ? o.line : Math.min(h.lo, o.line); }
    if (o.open != null && h.open.line !== o.open && h.hist.length === 1) h.open = { line:o.open, price:null, t:null, source:'book opener' };
    h.updated = now; h.start = g.date; await DB.put('odds', key, h);
  }
}
async function oddsHistoryFor(gid){ return (await DB.all('odds')).map(x => x[1]).filter(h => h.gid === gid); }

/* ============================ PROVIDER HEALTH + FAILOVER ============================ */
const HEALTH = store.get('np_health', {});
function healthRec(name){ return HEALTH[name] ||= { name, ok:0, err:0, lastOk:null, lastErr:null, lastMsg:'', ms:0, events:0, markets:0, cooldownUntil:0, recentErr:[] }; }
function healthMark(name, ok, ms, info = {}){
  const h = healthRec(name), now = Date.now();
  if (ok){ h.ok++; h.lastOk = now; h.ms = Math.round(ms); if (info.events != null) h.events = info.events; if (info.markets != null) h.markets = info.markets; h.recentErr = h.recentErr.filter(t => now - t < 300000); }
  else { h.err++; h.lastErr = now; h.lastMsg = info.msg || ''; h.recentErr = [...h.recentErr.filter(t => now - t < 300000), now];
    if (h.recentErr.length >= 3){ h.cooldownUntil = now + Math.min(10*60000, 60000 * Math.pow(2, h.recentErr.length - 3)); alertPush('warn', `${name} failed ${h.recentErr.length} times in 5 minutes. Pausing it for ${Math.round((h.cooldownUntil-now)/60000)} min and using the backup source.`); } }
  store.set('np_health', HEALTH);
}
const healthStatus = h => !h || (!h.lastOk && !h.lastErr) ? 'idle' : h.cooldownUntil > Date.now() ? 'offline' : (h.lastErr && (!h.lastOk || h.lastErr > h.lastOk)) ? 'degraded' : 'online';
async function viaProvider(kind, method, ...args){
  const list = Providers[kind]; let lastErr = null;
  for (let i = 0; i < list.length; i++){
    const p = list[i], name = `${p.name} · ${kind}`;
    if (!p[method] || (p.enabled && !p.enabled())) continue;
    if (healthRec(name).cooldownUntil > Date.now()) continue;
    const t0 = performance.now();
    try { const r = await p[method](...args); healthMark(name, true, performance.now()-t0, { events: Array.isArray(r) ? r.length : undefined, markets: r?.offers?.length });
      if (i > 0) alertPush('ok', `Using backup source ${p.name} for ${kind}.`); return { data:r, provider:p.name }; }
    catch(e){ lastErr = e; healthMark(name, false, performance.now()-t0, { msg:e.message }); }
  }
  if (lastErr) throw lastErr; return { data:null, provider:null };
}
/* ============================ ALERTS ============================ */
const ALERTS = [];
function alertPush(lvl, text){
  const last = ALERTS[0]; if (last && last.text === text && Date.now() - last.t < 120000) return;
  ALERTS.unshift({ lvl, text, t:Date.now() }); ALERTS.length = Math.min(ALERTS.length, 50);
  const el = document.getElementById('toast'); if (el && lvl !== 'info'){ el.textContent = text; el.className = 'toast ' + lvl; el.hidden = false; clearTimeout(alertPush.t); alertPush.t = setTimeout(() => el.hidden = true, 6000); }
}

/* ============================ DATA-QUALITY ENGINE: bad data never reaches the model ============================ */
function validateOffers(g, offers){
  const out = [], seen = new Map(), issues = { impossible:0, dupes:0, stale:0 };
  for (const o of offers){
    if (o.price != null && (!isFinite(o.price) || (o.price > -100 && o.price < 100) || Math.abs(o.price) > 100000)){ issues.impossible++; continue; }
    if (o.line != null && !isFinite(o.line)){ issues.impossible++; continue; }
    if (o.market === 'spread' && Math.abs(o.line) > ({ nfl:45, nba:40, mlb:8, nhl:5, soccer:5 })[g.sport]){ issues.impossible++; continue; }
    if (o.market === 'total' && (o.line <= 0 || o.line > ({ nfl:90, nba:300, mlb:25, nhl:15, soccer:10 })[g.sport])){ issues.impossible++; continue; }
    if (o.scope === 'player' && o.line != null && o.line < 0){ issues.impossible++; continue; }
    const k = `${o.book}|${o.scope}|${o.period}|${o.market}|${o.team||''}|${o.playerId||normName(o.playerName||'')}|${o.side}|${o.line}`;
    const prev = seen.get(k); if (prev){ issues.dupes++; if ((o.updated||0) > (prev.updated||0)) out[out.indexOf(prev)] = o, seen.set(k, o); continue; }
    if (o.priced && o.updated && Date.now() - o.updated > 6*3600e3) issues.stale++;
    seen.set(k, o); out.push(o);
  }
  return { offers:out, issues };
}

/* ============================ PIPELINE: collect → normalize → validate → store → model → rank → SGP ============================ */
const CACHE = {}; const PREV = {};

  } else {

  }

  if (sport !== 'soccer' && !live){ try { const t1 = performance.now(); const r = await espn.propOffers(g, idx); offers.push(...r.offers); healthMark('ESPN · props', true, performance.now()-t1, { markets:r.offers.length }); } catch(e){ healthMark('ESPN · props', false, 0, { msg:e.message }); dq.push({ lvl:'warn', t:'Free player prop lines could not be loaded.' }); } }

      if (ok.length) sources.push(`ESPN live odds (${ok.join(', ')})`); else dq.push({ lvl:'warn', t:'ESPN hasn\'t posted live odds for this game yet (or they are still the pregame numbers). Scores, tracker and research still update.' });
      healthMark('ESPN · live odds', true, 0, { markets:lv.length }); } catch(e){ healthMark('ESPN · live odds', false, 0, { msg:e.message }); } }
  if (live){ if (useOA && oa.enabled()){ onStep('Pulling live odds…'); await liveOddsFetch(g, true); } oaData = LIVE_OA[g.id]?.data || null;
    if (!oaData && oa.enabled()) dq.push({ lvl:'warn', t:'Odds API live odds load on a credit budget; waiting for the next pull.' }); }

/* ============================ EXPLANATIONS ============================ */
function whyShort(R, c){ return firstSentences(whyText(R, c), 2); }
function whyText(R, c){

  const { g, gm } = R, S = [], sn = SCRIPT_TEXT(gm, g);
  if (c.kind === 'player' && c.model?.kind === 'dist'){
    const m = c.model, nm = c.player?.name || 'He', st = statLabel(g.sport, c.stat).toLowerCase();
    if (c.hit10 && c.hit10.n >= 3) S.push(`${nm} has gone ${c.side} ${c.line} ${st} in ${c.hit10.h} of his last ${c.hit10.n} games${m.seasonAvg!=null?`, averaging ${fmt1(m.seasonAvg)}`:''}.`);
    else if (m.n) S.push(`${nm} has ${plural(m.n,'game')} on record, averaging ${fmt1(m.seasonAvg)}.`); else S.push(`No game log for ${nm} yet, so this leans on the market.`);
    if (m.last3 != null && m.seasonAvg){ const r = m.last3/m.seasonAvg; if (r > 1.12) S.push(`Trending up: ${fmt1(m.last3)} a game over his last three.`); else if (r < 0.88) S.push(`Trending down: ${fmt1(m.last3)} a game over his last three.`); }
    if (/recept|longest_reception/.test(c.stat) && m.usage.targets != null) S.push(`He's seeing ${fmt1(m.usage.targets)} targets a game.`);
    if (/^rush_/.test(c.stat) && m.usage.carries != null) S.push(`He's getting ${fmt1(m.usage.carries)} carries a game.`);
    if (/^pass_/.test(c.stat) && m.usage.passAtt != null) S.push(`He's throwing ${fmt1(m.usage.passAtt)} passes a game.`);
    if (m.usage.minutes != null && g.sport==='nba') S.push(`He's playing ${fmt1(m.usage.minutes)} minutes a night.`);
    S.push(...m.why);
    if (c.isAlt){ const main = R.cands.find(x => x.family === c.family && x.side === c.side && !x.isAlt); if (main) S.push(`This alternate line hits ${pct(c.p,0)} of the time vs ${pct(main.p,0)} for the standard ${main.line}, and the price ${c.ev > main.ev ? 'pays you better for it' : 'is the trade-off'}.`); }
  } else if (c.kind === 'player' && c.model?.kind === 'binary'){
    const m = c.model; S.push(`${c.player?.name || 'This player'}: ${m.ctxNote || 'limited history'}.`);
    if (m.pc != null && m.pm != null) S.push(`His history says ${pct(m.pc,0)}; the sportsbooks (after their cut) say ${pct(m.pm,0)}.`);
    if (!m.path) S.push('Even if the price looks good, he does not have a real path to this outcome, so it is not recommended.');
  } else if (c.kind === 'margin' && g.sport !== 'soccer'){
    S.push(`Our model has ${gm.mu >= 0 ? g.home.short : g.away.short} by ${fmt1(Math.abs(gm.mu))}; the market says ${gm.muMkt >= 0 ? g.home.short : g.away.short} by ${fmt1(Math.abs(gm.muMkt))}.`);
    const opp = c.team ? (c.team==='home'?'away':'home') : null; if (opp){ const outs = (R.D.injuries[opp]||[]).filter(x => /^(out|doubtful)/i.test(x.status) && x.date && (Date.now()-new Date(x.date)) < 21*864e5); if (outs.length) S.push(`${g[opp].short} will be without ${outs.slice(0,3).map(x=>`${x.pos} ${x.name}`).join(', ')}.`); }
    if (gm.formMargin != null) S.push(`Recent form leans ${gm.formMargin >= 0 ? g.home.short : g.away.short} by about ${fmt1(Math.abs(gm.formMargin))}.`);
    if (R.D.predictor && c.team) S.push(`ESPN's power index gives ${g[c.team].short} ${pct(c.team==='home'?R.D.predictor.home:R.D.predictor.away,0)} to win.`);
  } else if (g.sport === 'soccer' && (c.kind === 'margin' || c.kind === 'btts' || c.kind === 'total' || c.kind === 'tt')){

function nextInterval(games){
  const now = Date.now(), live = games.some(g => g.state === 'in');

async function maintenance(){
  try {
    // archive finished events, drop odds history older than 14 days, clean expired cache entries
    const now = Date.now(); let removed = 0;
    for (const [k, v] of await DB.all('odds')) if (v.start && now - new Date(v.start).getTime() > 14*864e5){ await DB.del('odds', k); removed++; }
    for (const [k, v] of await DB.all('events')) if (v.date && now - new Date(v.date).getTime() > 2*864e5 && v.state !== 'archived'){ v.state = 'archived'; await DB.put('events', k, v); }

function topBets(res){
  const F = state.filters; let all = res.flatMap(R => R.ranked.map(c => ({ c, R })));
  if (F.game) all = all.filter(x => x.R.g.id === F.game);
  if (F.type) all = all.filter(x => x.c.type === F.type);
  if (F.market) all = all.filter(x => statLabel(x.R.g.sport, x.c.market) === F.market);
  if (F.player) all = all.filter(x => (x.c.player?.name||'').toLowerCase().includes(F.player.toLowerCase()));
  if (F.book) all = all.filter(x => x.c.book === F.book);
  if (F.risk) all = all.filter(x => x.c.risk === F.risk);

  nhl:[['scoring','Scoring',[['goals','G'],['assists','A'],['points','Pts'],['power_play_points','PPP']]], ['shots','Shots',[['shots_on_goal','SOG'],['blocked_shots','Blk']]], ['goalies','Goalies',[['saves','Saves']]]],

function statCatTabs(R){

  const avg = (logs, st, n) => { const v = logs.slice(0, n).map(x => logVal(g.sport, x, st)).filter(v => v != null); return v.length ? avgArr(v) : null; };
  return cats.map(([k, label, stats, posOk]) => {
    const rows = players.filter(x => !posOk || posOk(x.info.player.pos || '')).map(x => {
      const vals = stats.map(([st]) => [avg(x.logs, st, 5), avg(x.logs, st, 10)]), tot = vals.reduce((t, [a, b]) => t + (a || 0) + (b || 0), 0);
      const prop = R.cands.filter(c => c.playerId === x.pid && stats.some(([st]) => st === c.stat) && c.line != null && !c.isAlt).sort((a,b) => b.quality - a.quality)[0];
      return { x, vals, tot, prop, gp:Math.min(10, x.logs.length) }; }).filter(r => r.tot > 0).sort((a,b) => (b.vals[0][0] ?? b.vals[0][1] ?? 0) - (a.vals[0][0] ?? a.vals[0][1] ?? 0));
    const html = rows.length ? `<div class="tablewrap tall"><table class="sortable"><thead><tr><th>Player</th><th>Team</th><th class="num">GP</th>${stats.map(([, l]) => `<th class="num">${esc(l)} L5</th><th class="num">${esc(l)} L10</th>`).join('')}<th>Prop line</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><a class="pl plink" href="${plHref(g.id, r.x.pid)}">${avatar(r.x.info.player)}<span><b>${esc(r.x.info.player.name)}</b> <span class="note">${esc(r.x.info.player.pos || '')}</span></span></a></td><td>${esc(g[r.x.info.side].abbr)}</td><td class="num">${r.gp}</td>

        <td>${r.prop ? `${esc(statLabel(g.sport, r.prop.stat))} ${esc(r.prop.side)} ${r.prop.line}${r.prop.hit10 ? ` <span class="note">(${r.prop.hit10.h}/${r.prop.hit10.n} L10)</span>` : ''}` : '<span class="note">—</span>'}</td></tr>`).join('')}</tbody></table></div>

/* ---------- Deep Research → Player props: one sub-tab per prop category ---------- */
const PROP_EXTRA = { nfl:[['def','Defense', s => /sacks|tackles|def_interceptions/.test(s)], ['kick','Kicking', s => /field_goals|kicking_points|pats/.test(s)]] };
function propCatTabs(R){
  const g = R.g, defs = [...(MKT_TABS[g.sport] || []), ...(PROP_EXTRA[g.sport] || [])];
  const best = new Map();
  for (const c of R.cands.filter(c => c.kind === 'player' && !c.isAlt && c.playerId).sort((a,b) => b.quality - a.quality)){ const k = c.playerId + '|' + c.stat + '|' + (c.model?.kind === 'binary' ? c.side : ''); if (!best.has(k)) best.set(k, c); }
  const posted = [...best.values()].filter(c => c.model?.kind !== 'binary' || c.side === 'yes').map(c => ({ ...c, conf:c.quality }));
  const all = [...posted, ...statProps(R)];                       // posted lines first, then a stats line for everything else
  const row = (c, star) => `<tr class="click" data-player="${c.playerId}" data-game="${g.id}"><td>${star ? '⭐' : ''}</td><td><div class="pl">${avatar(c.player)}<div><b>${esc(c.player?.name)}</b><div class="note">${esc(c.player?.pos||'')} · ${esc(g[c.team]?.abbr||'')}</div></div></div></td>
    <td>${esc(statLabel(g.sport, c.stat))}</td><td class="num">${c.line ?? '—'}${!c.synth && c.G?.open!=null && c.G.open!==c.line?`<div class="note">opened ${c.G.open}</div>`:''}</td><td class="num">${c.synth || c.model?.kind === 'dist' ? fmt1(c.synth ? c.proj : c.model.proj) : '—'}</td>
    <td><b style="color:${c.side==='over'||c.side==='yes'?'var(--good)':'var(--bad)'}">${esc(String(c.side).toUpperCase())}</b></td><td class="num ${c.p>=0.58?'hot':''}">${pct(c.p,0)}</td>
    <td class="num">${c.synth ? `<span class="note">fair</span> ${decToAm(1/Math.max(c.p, 0.02))}` : `${priceStr(c)} <span class="note">${c.priced?esc(c.book):''}</span>`}</td><td class="num">${c.hit10?`${c.hit10.h}/${c.hit10.n}`:'—'}</td>
    <td>${c.synth ? '<span class="pill">Stats line</span>' : '<span class="pill solid">Posted</span>'}</td><td>${c.noPath ? '<span class="pill bad">No path</span>' : strengthPill(c.conf)}</td></tr>`;
  const table = list => { const sorted = [...list].sort((a,b) => b.conf - a.conf), top = new Set(sorted.filter(c => !c.noPath).slice(0, 5));
    return `<div class="tablewrap tall"><table class="sortable"><thead><tr><th>Top</th><th>Player</th><th>Prop</th><th class="num">Line</th><th class="num">Proj.</th><th>Pick</th><th class="num">Chance</th><th class="num">Odds</th><th class="num">Hit L10</th><th>Source</th><th>Rating</th></tr></thead><tbody>${sorted.map(c => row(c, top.has(c))).join('')}</tbody></table></div>`; };
  const legend = '<div class="note">⭐ = our top 5 in this category. <b>Posted</b> = a book line. <b>Stats line</b> = no line posted yet, so it uses his recent median, with the chance from his last 10 games and a fair price (bet it only at that price or better). Tap a column to sort, a player for his page.</div>';
  const used = new Set(), tabs = [];
  for (const [k, label, test] of defs){
    const list = all.filter(c => test(c.stat || '')); list.forEach(c => used.add(c)); if (!list.length) continue;
    tabs.push([k, `${label} (${list.length})`, `${table(list)}${legend}`]);
  }
  const rest = all.filter(c => !used.has(c)); if (rest.length) tabs.push(['other', `Other (${rest.length})`, table(rest) + legend]);
  if (g.sport === 'nfl') { const i = tabs.findIndex(t => t[0] === 'td'); const btn = `<div class="actions">${goBtn('Open TD scorers', 'data-tabjump="research:td"')}</div><div class="note">TD scorers ranks every QB, RB, WR and TE by chance to score, using usage, team totals and injuries.</div>`;
    if (i >= 0) tabs[i][2] += btn; else tabs.unshift(['td', 'Touchdowns', btn]); }
  if (!tabs.length) tabs.push(['none', 'Props', `<div class="panel note">${Object.keys(R.logs).length ? 'No player stats are deep enough yet for a pick.' : 'Player logs are loading…'}</div>`]);

}

/* ============================ STATS-BASED PROPS + MATCHUP BY GAME SCRIPT ============================ */
/* When a book hasn't posted a line, the site still gives a pick: a "stats line" (his recent median, at the usual .5),
   our chance over/under from his last 10 games, and a fair price. Posted lines are always preferred and listed first. */
const SYN_SKIP = /^(minutes|targets|carries|longest_completion|longest_rush|longest_reception|pats|kicking_points)$/;
const synMin = st => /yds|yards/.test(st) ? 10 : /td|goal|home_runs|stolen|interceptions|blocks|steals|power_play/.test(st) ? 0.12 : 0.8;
function logDist(R, pid, st){
  const g = R.g, v = (R.logs[pid] || []).slice(0, 10).map(x => logVal(g.sport, x, st)).filter(x => x != null);
  if (v.length < 3) return null;
  let sw = 0, sm = 0; v.forEach((x, i) => { const w = Math.pow(0.85, i); sw += w; sm += w*x; });
  const mean = sm/sw, sd = Math.max(Math.sqrt(avgArr(v.map(x => (x - mean)**2))), /yds|yards/.test(st) ? Math.max(8, mean*0.3) : Math.max(0.5, Math.sqrt(Math.max(mean, 0.2))*0.9));
  const sorted = [...v].sort((a,b) => a - b), med = sorted[Math.floor(sorted.length/2)];
  return { v, mean, sd, med, n:v.length };
}
function pOverStats(d, line, mult = 1){
  const m = d.mean*mult, emp = (d.v.filter(x => x*mult > line).length + 1)/(d.n + 2), nrm = 1 - normCdf((line - m)/(d.sd*Math.sqrt(mult)));
  return clamp(d.n >= 6 ? 0.5*emp + 0.5*nrm : 0.35*emp + 0.65*nrm, 0.03, 0.92);   // short samples lean on the smoother normal estimate
}
function statProps(R){
  if (R._syn && R._synAt === R.at && R._synN === Object.keys(R.logs).length) return R._syn;
  const g = R.g, keys = Object.keys(SPORT[g.sport]?.log || {}).filter(k => !SYN_SKIP.test(k)), out = [];
  const posted = new Set(R.cands.filter(c => c.playerId && !c.isAlt).map(c => c.playerId + '|' + c.stat));
  for (const pid of Object.keys(R.logs)){ const info = R.idx[pid]; if (!info) continue;
    if (g.sport === 'mlb'){ /* hitters vs pitchers share stat names */ }
    for (const st of keys){
      if (posted.has(pid + '|' + st)) continue;
      const pit = /^(P|SP|RP)$/.test(info.player.pos || ''); if (g.sport === 'mlb' && (pit !== /^pitcher_|earned_runs|hits_allowed/.test(st))) continue;
      const d = logDist(R, pid, st); if (!d || d.mean < synMin(st)) continue;
      const line = /td|goal|home_runs/.test(st) && d.mean < 1.2 ? 0.5 : Math.floor(d.med) + 0.5;
      const tdLike = /td|goal|home_runs|stolen/.test(st), po = pOverStats(d, line), side = tdLike || po >= 0.5 ? 'over' : 'under', p = side === 'over' ? po : 1 - po;   // scorer stats: always the "yes" side
      out.push({ synth:true, playerId:pid, player:info.player, team:info.side, stat:st, line, side, p, proj:d.mean, n:d.n, d,
        hit10:{ h:d.v.filter(x => side === 'over' ? x > line : x < line).length, n:d.n }, conf:clamp(0.45 + (p - 0.5)*1.5, 0, 0.85)*(d.n >= 6 ? 1 : 0.85),
        label:`${info.player.name} ${side === 'over' ? 'Over' : 'Under'} ${line} ${statLabel(g.sport, st)}` });
    } }

}
/* how a game script moves each player's numbers */
function scriptMult(R, side, st, s){
  const g = R.g, fav = R.gm.favSide === side; if (s === 'B') return 1;
  const lead = (s === 'A') === fav;               // is this player's team the one in control?
  if (g.sport === 'nfl'){
    if (/td/.test(st)) return lead ? 1.18 : 0.8;
    if (/^rush_|carries|rush_attempts|longest_rush/.test(st)) return lead ? 1.12 : 0.82;
    if (/^pass_|reception|receptions|targets/.test(st)) return lead ? 0.93 : 1.1;
    return 1;
  }
  if (g.sport === 'nba') return lead ? 0.95 : 0.97;          // blowouts sit starters on both sides
  if (g.sport === 'mlb' || g.sport === 'nhl') return lead ? 1.1 : 0.88;
  return 1;
}
function scriptPicks(R, s){
  const g = R.g, sn = SCRIPT_TEXT(R.gm, g);
  const gameBets = R.cands.filter(c => !c.playerId && (c.align?.[s] || 0) > 0 && c.ev > -0.06).sort((a,b) => (b.quality + 0.15*b.align[s]) - (a.quality + 0.15*a.align[s])).slice(0, 3);
  const props = [];
  for (const c of R.cands.filter(c => c.playerId && !c.isAlt && c.line != null && c.model?.kind === 'dist')){ const d = logDist(R, c.playerId, c.stat); if (!d) continue;
    const po = pOverStats(d, c.line, scriptMult(R, c.team, c.stat, s)), p = c.side === 'over' ? po : 1 - po; props.push({ c, p, posted:true }); }
  for (const x of statProps(R)){ if (/td|goal|home_runs|stolen/.test(x.stat)) continue; const po = pOverStats(x.d, x.line, scriptMult(R, x.team, x.stat, s)), side = po >= 0.5 ? 'over' : 'under', p = Math.max(po, 1 - po);
    props.push({ c:{ ...x, side, label:`${x.player.name} ${side === 'over' ? 'Over' : 'Under'} ${x.line} ${statLabel(g.sport, x.stat)}` }, p, posted:false }); }
  const sc = x => x.p + (x.posted ? 0.04 : 0) + (x.c.side === 'over' ? 0.02 : 0) - (x.p > 0.82 ? 0.1 : 0) + (/yds|receptions|points|rebounds|assists|hits|total_bases|shots|strikeouts/.test(x.c.stat) ? 0.03 : 0);
  const seen = new Set(), bestProps = props.sort((a,b) => sc(b) - sc(a)).filter(x => { const k = x.c.playerId + x.c.stat; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
  let td = null;
  if (g.sport === 'nfl' && R.tdm?.rows?.length){
    const rows = R.tdm.rows.filter(x => !x.live?.tds).map(x => { const m = scriptMult(R, x.side, 'tds', s), p0 = x.pr.any, ps = 1 - Math.exp(-x.lam*m); return { x, p0, ps, drop:ps/Math.max(p0, 0.01) }; });
    const best = [...rows].sort((a,b) => b.ps - a.ps).slice(0, 3);
    const avoid = [...rows].sort((a,b) => b.p0 - a.p0).slice(0, 10).filter(r => !best.includes(r)).sort((a,b) => a.drop - b.drop).slice(0, 3);
    td = { best, avoid };
  }
  return { gameBets, bestProps, td, title:sn[s].title };
}
function matchupScriptsHtml(R){
  const { g, gm } = R, sn = SCRIPT_TEXT(gm, g);
  const item = (href, label, note, star) => `<li>${star ? '⭐ ' : ''}${href ? `<a class="plink" href="${href}">${esc(label)}</a>` : esc(label)} <span class="note">${note}</span></li>`;

        <div class="ms"><span class="lbl" style="color:var(--bad)">TD scorers to avoid</span><ul>${P.td.avoid.map(r => `<li><a class="plink" href="${plHref(g.id, r.x.id)}">${esc(r.x.p.name)}</a> <span class="note">${r.drop < 0.95 ? `${pct(r.p0,0)} overall → ${pct(r.ps,0)} here (${esc(g[r.x.side].short)} score less in this script)` : `only ${pct(r.ps,0)} to score in this script, low for a regular target`}</span></li>`).join('')}</ul></div>` : '<div class="ms note">TD picks load in a moment…</div>') : ''}

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recent games vs the line">${v.map((x,i)=>`<rect x="${pad+i*bw+4}" y="${y(x)}" width="${bw-8}" height="${Math.max(1,H-22-y(x))}" rx="3" fill="${x>line?'#2BD48A':'#5A6290'}"/><text x="${pad+i*bw+bw/2}" y="${y(x)-4}" fill="#F1F3FF" font-size="11" text-anchor="middle" font-family="IBM Plex Mono, monospace">${fmt1(x)}</text><text x="${pad+i*bw+bw/2}" y="${H-6}" fill="#9AA1CC" font-size="10" text-anchor="middle">${esc(lb[i]||'')}</text>`).join('')}
    <line x1="${pad}" x2="${W-pad}" y1="${y(line)}" y2="${y(line)}" stroke="#FFD43B" stroke-dasharray="5 4" stroke-width="2"/><text x="${W-pad}" y="${y(line)-5}" fill="#FFD43B" font-size="11" text-anchor="end">Line ${line}</text></svg>`;
}

/* ---------- TD scorers (NFL): every QB/RB/WR/TE on both rosters, ranked by chance to score ---------- */
/* Model (free data only):
   team TDs  = market-implied team total × 0.113 (NFL points → TDs), nudged by weather and game script
   rush/pass split = this team's own rushing vs receiving TDs in recent games (shrunk to the league's ~42% rush)
   player λ  = team rush TDs × goal-line-weighted carry share + team pass TDs × red-zone-weighted target share,
               blended with his own recent TD rate, then blended 50/50 with the sportsbook price when one exists.
   Shares are taken among players who are actually available, so an injured starter's work moves to his teammates. */
const TD_SKILL = /^(QB|RB|FB|WR|TE)$/;
const TD_RZ_TGT = { TE:1.3, WR:1.0, RB:0.75, FB:0.9, QB:0 };
async function tdModel(R){
  if (R.tdm && R.tdm.at === R.at) return R.tdm;
  const g = R.g, gm = R.gm, D = R.D, out = { at:R.at, rows:[], team:{} };
  const ids = Object.entries(R.idx).filter(([, x]) => TD_SKILL.test(x.player.pos || '') && !/injured reserve|suspend|practice/i.test(x.player.status || '')).map(([id]) => id);
  const need = ids.filter(id => !R.logs[id]);
  if (need.length){ const arr = await pool(need, 6, id => viaProvider('playerData','gamelog','nfl', id).then(r => r.data || []).catch(() => [])); need.forEach((id, i) => R.logs[id] = arr[i] || []); }

  const sides = ['away','home'], lamAll = {};

    let tt = gm.ttMean?.[side] ?? (pf.length ? avgArr(pf) : 21);
    // recent team games (this season first): union of teammates' game ids, newest first
    const games = new Map(); for (const id of mine) for (const x of (R.logs[id] || [])) if (!games.has(x.id) || x.season === 'this season') games.set(x.id, x);
    const recent = [...games.values()].sort((a,b) => (a.season === b.season ? 0 : a.season === 'this season' ? -1 : 1) || new Date(b.date) - new Date(a.date)).slice(0, 6).map(x => x.id);
    const wOf = gid => Math.pow(0.85, recent.indexOf(gid));
    let rushTD = 0, recTD = 0;
    const per = mine.map(id => { const p = R.idx[id].player, inj = injOf(side, id), logs = (R.logs[id] || []).filter(x => recent.includes(x.id));
      let car = 0, tgt = 0, td = 0, w = 0, gp = 0, tdg = 0;
      for (const x of logs){ const k = wOf(x.id), c = logVal('nfl', x, 'carries') || 0, t = logVal('nfl', x, 'targets') || 0, rt = logVal('nfl', x, 'rush_tds') || 0, et = logVal('nfl', x, 'reception_tds') || 0;
        car += k*c; tgt += k*t; td += k*(rt + et); w += k; gp++; if (rt + et > 0) tdg++; rushTD += rt; recTD += et; }
      const wAll = recent.reduce((s, gid) => s + wOf(gid), 0) || 1;
      return { id, p, side, inj, out: !!inj && /^(out|doubtful|injured reserve)/i.test(inj.status), q: !!inj && /^questionable/i.test(inj.status),
        car: car / wAll, tgt: tgt / wAll, carG: w ? car / w : 0, tgtG: w ? tgt / w : 0, tdRate: w ? td / w : 0, gp, tdg, logs: (R.logs[id] || []).slice(0, 6) }; });
    // weather and script nudge how the team scores

    for (const x of avail){

      await pool(games, 3, async g => { try { if (liveOddsDue(g, watched(g.id))) await liveOddsFetch(g, watched(g.id)); await analyzeGame(g, { force:true }); jobRun('live', true, g.short); } catch(e){ jobRun('live', false, e.message); } });
      liveRepaint();
    }
    liveLoop();
  }, delay);
}
function liveRepaint(){
  headerSync(); trkCheck(); const h = location.hash;
  if (h === '#live') renderLive(); else if (isHome()) repaint();
  else if (h.startsWith('#g-') && gameOf(h.slice(3))?.state !== 'pre') renderGame(h.slice(3));
  else if (h.startsWith('#r-') && ['live','td'].includes(state.tabs.research) && gameOf(h.slice(3))?.state === 'in') renderResearch(h.slice(3));
}

/* ============================ LIVE STAT TRACKING + MY TRACKER (saved on this device) ============================ */
const TRK_REG = {};
const trkLoad = () => { try { return store.get('np_track', []) || []; } catch(e){ return []; } };
const trkSave = list => store.set('np_track', list);
const trkHas = key => trkLoad().some(x => x.key === key);
function trkSingle(c, gid){ const g = gameOf(gid) || CACHE[gid]?.g; return { key:'s:' + gid + ':' + c.id, type:'single', gid, sport:g?.sport, game:g ? matchup(g) : '', date:g?.date, ...snapPick(c), name:c.player?.name || null, addedAt:Date.now() }; }
function trkParlay(s, R){ const legs = s.legs.map(l => ({ ...snapPick(l), gid:l.gid || R?.g.id, name:l.player?.name || null }));
  return { key:'p:' + hsh(s.sig.join()), type:'parlay', name:`${s.tierName || ''} ${s.weekly ? 'weekly parlay' : 'SGP'}`.trim(), odds:decToAm(s.estDec), gid:legs[0]?.gid, legs, addedAt:Date.now() }; }
function trackBtn(item){ TRK_REG[item.key] = item; const on = trkHas(item.key); return goBtn(on ? 'Tracking ✓' : 'Track', `data-track="${esc(item.key)}" aria-pressed="${on}"`); }
function trkToggle(key){
  let list = trkLoad(); const on = list.some(x => x.key === key);
  if (on) list = list.filter(x => x.key !== key); else if (TRK_REG[key]) list.push(TRK_REG[key]);
  trkSave(list); document.querySelectorAll(`[data-track="${CSS.escape(key)}"]`).forEach(b => { b.textContent = on ? 'Track' : 'Tracking ✓'; b.setAttribute('aria-pressed', String(!on)); });
  trkBadge(); alertPush('ok', on ? 'Off the card. Removed from My tracker.' : 'Locked in. Added to My tracker.');
}
const TRK_GROUP = { 'Hit':'Hit', 'Lost':'Lost', 'Push':'Push', 'On pace':'On pace', 'On track':'On pace', 'Covering':'On pace', 'Winning':'On pace', 'Behind pace':'Behind', 'Trending over':'Behind', 'Not covering':'Behind', 'Losing':'Behind', 'Needs a TD':'Behind', 'In play':'Behind' };
function trkEval(x){
  const R = CACHE[x.gid], g = R?.g || gameOf(x.gid);
  if (!g || g.state === 'pre') return { status:'Not started', pct:0, txt: g ? `Starts ${timeET(g.date)}` : (x.last?.txt || 'Waiting for the game'), cls:'mid' };
  if (!R) return x.last || { status:'Waiting', pct:0, txt:'Loading the game…', cls:'mid' };
  const t = trackItem(x, R); return { ...t, status: TRK_GROUP[t.status] || t.status };
}
function trkBadge(){ const n = trkLoad().length, b = $('#trkBadge'); if (b){ b.textContent = n; b.hidden = !n; } }
/* Brief in-page notices when a tracked leg hits or loses, or a tracked player leaves the game */
function trkCheck(){
  const list = trkLoad(); let dirty = false;
  const check = (x, parent) => { const t = trkEval(x), prev = x.last?.status;
    if ((t.status === 'Hit' || t.status === 'Lost') && prev !== t.status) alertPush(t.status === 'Hit' ? 'ok' : 'bad', `${t.status === 'Hit' ? '💰 Cashed' : '✗ Burned'}: ${x.label}${parent ? ` (${parent})` : ''}`);
    const R = CACHE[x.gid]; if (x.playerId && R?.isLive && !x.injNote && playerLeft(R, x.playerId)){ x.injNote = true; alertPush('warn', `${x.name || 'A tracked player'} left the game (possible injury). Tracked: ${x.label}`); }
    if (t.status !== 'Waiting' && JSON.stringify(t) !== JSON.stringify(x.last)){ x.last = t; dirty = true; } };
  for (const it of list){ if (it.type === 'parlay') it.legs.forEach(l => check(l, it.name)); else check(it); }
  if (dirty) trkSave(list);
  if (!$('#drawer').hidden && $('#pane').getAttribute('aria-label') === 'My tracker') openTracker(true);
}
function trkRow(x, removable){
  const t = trkEval(x), g = gameOf(x.gid) || CACHE[x.gid]?.g;
  return `<div class="trk"><div class="trk-t"><b>${esc(x.label)}</b> <span class="note">${esc(g ? matchup(g) : x.game || '')}${x.price ? ' · ' + esc(x.price) : ''}</span></div>
    <div class="trk-s"><span class="pill ${t.status === 'Hit' || t.status === 'On pace' ? 'strong' : t.status === 'Lost' ? 'bad' : 'lean'}">${esc(t.status)}</span> <span class="note">${esc(t.txt)}</span>${removable ? ` <button class="linkbtn" data-untrack="${esc(x.key)}">Remove</button>` : ''}</div>
    <div class="tbar ${t.status === 'Hit' || t.status === 'On pace' ? 'ok' : t.status === 'Lost' ? 'no' : 'mid'}"><i style="width:${(clamp(t.pct, 0, 1)*100).toFixed(0)}%"></i></div></div>`;
}
function openTracker(refresh){
  const list = trkLoad();
  const singles = list.filter(x => x.type === 'single'), parlays = list.filter(x => x.type === 'parlay');
  const pHtml = parlays.map(p => { const ev = p.legs.map(trkEval), hit = ev.filter(t => t.status === 'Hit').length, lost = ev.filter(t => t.status === 'Lost').length, rem = p.legs.length - hit - lost;
    return `<div class="panel stack" style="padding:0"><div class="row" style="justify-content:space-between;padding:10px 12px 0"><b>${esc(p.name)} ${esc(p.odds || '')}</b><span class="note">${hit} of ${p.legs.length} legs hit${lost ? ` · ${lost} lost` : ''} · ${rem} remaining <button class="linkbtn" data-untrack="${esc(p.key)}">Remove</button></span></div>
      <div class="rows trkl" style="border:0">${p.legs.map(l => trkRow(l, false)).join('')}</div></div>`; }).join('');
  const sug = Object.values(CACHE).filter(R => R.g.state !== 'post').flatMap(R => R.best.slice(0, 1).map(c => ({ c, R }))).slice(0, 3);
  const html = `<h2>My tracker</h2><p class="note" style="margin:0">Saved on this device. Updates with live stats during games.</p>
    ${list.length ? `${singles.length ? `<div class="rows trkl">${singles.map(x => trkRow(x, true)).join('')}</div>` : ''}${pHtml}
      ${list.some(x => (x.type === 'parlay' ? x.legs.every(l => ['Hit','Lost'].includes(trkEval(l).status)) : ['Hit','Lost','Push'].includes(trkEval(x).status))) ? '<button class="btn ghost sm" data-trkclear style="align-self:flex-start">Clear finished</button>' : ''}`
    : `<div class="panel note">Nothing tracked yet. Tap <b>Track</b> on any bet, parlay, parlay leg or player prop and it shows up here with live progress.</div>
      ${sug.length ? `<h3>Popular right now</h3>${sug.map(x => `<div class="trk"><div class="trk-t"><b>${esc(x.c.label)}</b> <span class="note">${esc(matchup(x.R.g))} · ${priceStr(x.c)}</span></div><div>${trackBtn(trkSingle(x.c, x.R.g.id))}</div></div>`).join('')}` : ''}`}`;
  const html2 = html + `<h3 style="margin-top:8px">How our picks have done</h3>${calSummaryHtml()}`;
  if (refresh){ const pane = $('#pane'); pane.innerHTML = `<button class="btn ghost" id="closeP" style="align-self:flex-end">Close ✕</button>${html2}`; $('#closeP').onclick = closePlayer; return; }
  openDrawer(html2, 'My tracker');
}
/* live tag + current stat for a player in a live game */
function liveTag(R, pid, stat){ if (!R || R.g.state !== 'in' || !R.D?.box?.[pid]) return ''; const v = stat ? liveStat(R.D, pid, stat, R.g.sport) : null;
  return `<span class="ltag">LIVE</span>${v != null ? ` <span class="note">${fmt1(v)} ${esc(statLabel(R.g.sport, stat))}</span>` : ''}`; }
/* live game page: box score with headshots + key plays */
function liveBoxHtml(R){
  const g = R.g, D = R.D, ts = ['away','home'].map(s => D.boxStats?.[s] || {}), labels = [...new Set(Object.keys(ts[0]).concat(Object.keys(ts[1])).filter(k => k.startsWith('L:')))];
  const team = `<details class="acc panel" open><summary>Team stats</summary>${labels.length ? `<div class="tablewrap tall" style="margin-top:6px"><table class="sortable"><thead><tr><th>Stat</th><th class="num">${esc(g.away.short)}</th><th class="num">${esc(g.home.short)}</th></tr></thead><tbody>${labels.map(k => `<tr><td>${esc(k.slice(2))}</td><td class="num">${ts[0][k] ?? '—'}</td><td class="num">${ts[1][k] ?? '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="note">Team stats show up once the game is underway.</div>'}</details>`;
  const side = s => { const cats = (D.boxPlayers || []).filter(b => b.side === s); if (!cats.length) return '';
    return `<details class="acc panel"><summary>${esc(g[s].name)} players</summary>${cats.map(b => `<div class="lbl" style="margin-top:8px">${esc(b.cat)}</div><div class="tablewrap"><table class="sortable"><thead><tr><th>Player</th>${b.labels.map(l => `<th class="num">${esc(l)}</th>`).join('')}</tr></thead><tbody>
      ${b.rows.map(r => { const p = R.idx[r.id]?.player || { name:r.name }; return `<tr><td><a class="pl plink" href="${plHref(g.id, r.id)}">${avatar(p)}<span>${esc(r.name)}</span></a></td>${r.stats.map(v => `<td class="num">${esc(v)}</td>`).join('')}</tr>`; }).join('')}</tbody></table></div>`).join('')}</details>`; };
  return `${team}${side('away')}${side('home')}`;
}
const BIG_PLAY = /touchdown|\btd\b|intercept|fumble|sack|safety|field goal|home run|homers|grand slam|goal\b|power play|penalty shot|three point|3-pt|dunk|and one|ejected|injur|for (2\d|[3-9]\d) yards|(2\d|[3-9]\d) yd/i;
function keyPlaysHtml(R){
  const plays = (R.D.plays || []).filter(p => p.scoring || BIG_PLAY.test(p.text)).reverse();
  if (!plays.length) return '<div class="panel note">Scoring plays and big moments show up here as they happen.</div>';
  return `<div class="rows">${moreList('kp' + R.g.id, plays.map(p => `<div class="play-r${p.scoring ? ' sc' : ''}"><span class="note">${p.period ? (R.g.sport === 'mlb' ? 'Inn ' : 'P') + p.period : ''} ${esc(p.clock)}${p.score ? ' · ' + esc(p.score) : ''}</span><div>${p.scoring ? '<b>Score · </b>' : ''}${esc(p.text)}</div></div>`), 5)}</div>`;
}
/* player page live stats bar: stat line + each prop line's progress */
function liveStatsBar(R, pid, rows){
  const g = R.g; if (!(g.state === 'in' || g.state === 'post') || !R.D.box?.[pid]) return '';
  let items = rows.filter(r => !r.alt && r.G.period === 'FG').map(r => ({ x:{ playerId:pid, stat:r.stat, market:r.stat, side:r.pick?.side || (r.line == null ? 'yes' : 'over'), line:r.line, period:'FG', team:R.idx[pid]?.side }, r:{ stat:r.stat, line:r.line } }));
  if (!items.length){ const S = preSnap(g.id); items = Object.entries(S?.lines || {}).filter(([k]) => k.startsWith('player|FG|') && k.endsWith('|' + pid)).map(([k, line]) => { const stat = k.split('|')[2];   // pregame prop lines when live props aren't posted
    return { x:{ playerId:pid, stat, market:stat, side:'over', line, period:'FG', team:R.idx[pid]?.side }, r:{ stat, line } }; }); }
  return `<div class="panel lsbar"><div class="row" style="gap:8px"><span class="ltag">${g.state === 'in' ? 'LIVE' : 'FINAL'}</span><b>${esc(boxLine(R, pid) || 'No stats yet')}</b></div>
    ${items.length ? `<div class="lsrows">${items.map(({ x, r }) => { const t = trackItem(x, R); return `<div class="lsr"><div class="row" style="justify-content:space-between"><span>${esc(statLabel(g.sport, r.stat))}${r.line != null ? '' : ''}</span><span class="note">${esc(t.txt)}${t.status && !t.txt.includes(t.status.toLowerCase()) ? ' — ' + esc(t.status.toLowerCase()) : ''}</span></div><div class="tbar ${t.cls}"><i style="width:${(clamp(t.pct,0,1)*100).toFixed(0)}%"></i></div></div>`; }).join('')}</div>` : ''}</div>`;
}

/* ============================ FLOW: discover → analyze → monitor → repeat ============================ */
const SCHED = { timer:null, next:0 };
CONFIG.weekCap = 30; CONFIG.todayCap = 24;
const isHome = () => !location.hash || location.hash === '#';
const isWeek = () => location.hash === '#week';
let paintT = 0; function repaint(){ const now = Date.now(); if (now - paintT < 700){ clearTimeout(repaint.t); repaint.t = setTimeout(repaint, 720); return; } paintT = now; if (isHome()) renderToday(); else if (isWeek()) renderWeek(); else if (location.hash === '#players' && document.activeElement?.id !== 'psearch') renderPlayers(); else headerSync(); }
async function discoverSoccer(){
  if (state.soccerLeagues && Date.now() - state.soccerLeagues.at < 30*60000) return state.soccerLeagues.list;
  const today = ymd(Date.now()), found = [];
  await pool(SOCCER_LEAGUES, 5, async ([lg]) => { try { const j = await fetchJSON(`${ESPN_SITE}soccer/${lg}/scoreboard?dates=${today}-${ymd(Date.now()+6*864e5)}`, { ttl:10*60000, retries:0 }); if ((j.events||[]).length) found.push(lg); }
    catch(e){ try { const j = await fetchJSON(`${ESPN_SITE}soccer/${lg}/scoreboard?dates=${today}`, { ttl:10*60000, retries:0 }); if ((j.events||[]).length) found.push(lg); } catch(e2){} } });
  const list = SOCCER_LEAGUES.map(x => x[0]).filter(k => found.includes(k));
  state.soccerLeagues = { at:Date.now(), list }; return list;
}
async function loadSlate(sport, target, opts){
  try {
    if (sport === 'soccer'){
      const sel = state.leagueSel && state.leagueSel.length ? state.leagueSel : (await discoverSoccer()).slice(0, 6);
      const lists = await pool(sel.length ? sel : ['eng.1'], 3, lg => viaProvider('sportsData','slate', 'soccer', lg, opts).then(r=>r.data||[]).catch(()=>[]));
      target.soccer = lists.flat().sort((a,b)=>new Date(a.date)-new Date(b.date));
    } else target[sport] = (await viaProvider('sportsData','slate', sport, undefined, opts)).data || [];
    jobRun('discover-' + sport + (opts?.days ? '-week' : ''), true, `${target[sport].length} events`); return true;
  } catch(e){ jobRun('discover-' + sport, false, e.message); alertPush('bad', `Couldn't load ${SPORT[sport].label} games right now. Showing what's saved.`); return false; }
}
async function analyzeList(games, cap, force, tok, isCurrent){
  const list = games.filter(g => g.state !== 'post').slice(0, cap);
  await pool(list, 2, async g => { if (!isCurrent(tok)) return; try { await analyzeGame(g, { force }); jobRun('analyze', true); } catch(e){ jobRun('analyze', false, e.message); } if (isCurrent(tok)) repaint(); });
}
async function reload(force){
  const tok = ++state.loadTok, cur = t => t === state.loadTok;
  state.busy = true; headerSync(); if (isHome()) renderToday();
  await pool(sportsInView(), 3, async sp => { if (await loadSlate(sp, state.slates)) state.loadedAt[sp] = Date.now(); });
  if (!cur(tok)) return;
  route(true);
  const v = viewGames(), first = [...v.games.filter(g => g.state === 'in'), ...v.games.filter(g => g.state !== 'in')];
  await analyzeList(first, CONFIG.todayCap, force, tok, cur);
  if (!cur(tok)) return;
  state.busy = false; repaint(); headerSync(); schedule(); liveLoop(3000);
  if (isWeek()) loadWeek(force);
}
async function loadWeek(force){
  const W = state.week, tok = ++W.tok, cur = t => t === W.tok;
  W.busy = true; if (isWeek()) renderWeek();
  await pool(sportsInView(), 3, sp => loadSlate(sp, W.slates, { days:7 }));
  if (!cur(tok)) return;
  W.loadedAt = Date.now(); if (isWeek()) renderWeek();
  await analyzeList(weekGames(), CONFIG.weekCap, force, tok, cur);
  if (!cur(tok)) return;
  W.busy = false; if (isWeek()) renderWeek(); schedule(); liveLoop(3000);
}
function schedule(){
  clearTimeout(SCHED.timer);
  const ms = nextInterval(isWeek() ? weekGames() : viewGames().all); SCHED.next = Date.now() + ms;
  SCHED.timer = setTimeout(async () => { if (document.hidden){ schedule(); return; } MEM.clear(); if (isWeek()) await loadWeek(true); else await reload(true); const h = location.hash; if (h.startsWith('#g-') || h.startsWith('#r-')) route(); }, ms);
}
async function refresh(kind){
  MEM.clear();
  if (kind !== 'odds'){ try { for (const k of Object.keys(localStorage)) if (/^np_(c_|log_|roster_|sm_)/.test(k)) localStorage.removeItem(k); } catch(e){} }
  alertPush('info', 'Refreshing…'); await reload(true);
}
function route(keepDrawer){
  if (!keepDrawer) closePlayer(); const h = location.hash;
  if (!h.startsWith('#r-')) state.tdHl = null;
  if (h.startsWith('#g-')) renderGame(h.slice(3)); else if (h.startsWith('#r-')) renderResearch(h.slice(3)); else if (h === '#health') renderHealth();
  else if (h === '#live'){ renderLive(); liveLoop(1500); }
  else if (h === '#players'){ renderPlayers(); if (!state.week.busy && !state.week.loadedAt) loadWeek(false); }
  else if (h.startsWith('#p-')){ const s = h.slice(3), i = s.indexOf('-'); renderPlayer(s.slice(0, i), decodeURIComponent(s.slice(i + 1))); }
  else if (h === '#week'){ renderWeek(); if (!state.week.busy && (!state.week.loadedAt || Date.now() - state.week.loadedAt > 20*60000)) loadWeek(false); }
  else renderToday();
  headerSync();
}

/* ---------- events ---------- */
document.querySelectorAll('#sportSeg button').forEach(b => b.onclick = () => { state.sport = b.dataset.sport; store.set('np_sport', state.sport); state.filters = {};
  if (/^#(g|r)-|^#health/.test(location.hash)) history.pushState(null, '', location.pathname); headerSync(); if (isWeek()){ renderWeek(); loadWeek(false); reload(false); } else reload(false); });
document.querySelectorAll('#whenSeg button').forEach(b => b.onclick = () => setWhen(b.dataset.when));
function setWhen(w){ state.when = w; store.set('np_when', w); headerSync(); renderToday(); reload(false); }
$('#openSettings').onclick = openSettings; $('#openAdv').onclick = openAdvanced;
window.addEventListener('hashchange', () => { route(); window.scrollTo({ top:0 }); });
window.addEventListener('popstate', () => route());
document.addEventListener('click', e => {
  const tg = e.target.closest('[data-tog]');
  if (tg){ const id = tg.dataset.tog, t = document.getElementById(id); if (t){ const open = t.hidden; t.hidden = !open; tg.setAttribute('aria-expanded', String(open)); tg.textContent = open ? tg.dataset.on : tg.dataset.off; open ? OPEN.add(id) : OPEN.delete(id); } return; }
  const tb = e.target.closest('[data-tab]');
  if (tb){ const bar = tb.closest('[data-tabs]'), key = bar.dataset.tabs, k = tb.dataset.tab; state.tabs[key] = k;
    bar.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', String(x === tb)));
    document.querySelectorAll(`[data-panel^="${key}:"]`).forEach(p => p.hidden = p.dataset.panel !== `${key}:${k}`); return; }
  const th = e.target.closest('table.sortable th');
  if (th){ const tbl = th.closest('table'), i = [...th.parentNode.children].indexOf(th), dir = th.dataset.dir === 'desc' ? 'asc' : 'desc', tb2 = tbl.tBodies[0];
    const val = td => { const t = (td?.innerText || '').trim(), n = parseFloat(t.replace(/[^0-9.+\-]/g,'')); return /^[+\-−]?\$?[0-9.]/.test(t) && isFinite(n) ? n : t.toLowerCase(); };
    const rows = [...tb2.rows].sort((a,b) => { const x = val(a.cells[i]), y = val(b.cells[i]); const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y)); return dir === 'asc' ? r : -r; });
    tbl.querySelectorAll('th').forEach(x => delete x.dataset.dir); th.dataset.dir = dir; rows.forEach(r => tb2.appendChild(r)); return; }
  if (e.target.closest('[data-clearf]')){ state.filters = {}; state.soccerFilter.team = ''; if (!$('#drawer').hidden && $('#pane').getAttribute('aria-label') === 'Advanced') openAdvanced(); renderToday(); return; }
  const wb = e.target.closest('[data-when]'); if (wb && !wb.closest('#whenSeg')){ setWhen(wb.dataset.when); window.scrollTo({ top:0 }); return; }
  const pl = e.target.closest('[data-player]'); if (pl){ location.hash = plHref(pl.dataset.game, pl.dataset.player); return; }
  const tj = e.target.closest('[data-tabjump]'); if (tj){ const [key, tab] = tj.dataset.tabjump.split(':'); const b = document.querySelector(`[data-tabs="${key}"] [data-tab="${tab}"]`); if (b){ b.click(); b.scrollIntoView({ block:'nearest' }); } return; }
  const tb2 = e.target.closest('[data-track]'); if (tb2){ trkToggle(tb2.dataset.track); return; }
  const ut = e.target.closest('[data-untrack]'); if (ut){ trkSave(trkLoad().filter(x => x.key !== ut.dataset.untrack)); trkBadge(); openTracker(true); return; }
  if (e.target.closest('[data-trkclear]')){ trkSave(trkLoad().filter(x => !(x.type === 'parlay' ? x.legs.every(l => ['Hit','Lost'].includes(trkEval(l).status)) : ['Hit','Lost','Push'].includes(trkEval(x).status)))); trkBadge(); openTracker(true); return; }
  if (e.target.closest('#openTracker')){ openTracker(); return; }
  const pd = e.target.closest('[data-pdeep]'); if (pd){ const [gid, pid] = pd.dataset.pdeep.split('|'); openPlayer(gid, pid); return; }
  const rt = e.target.closest('[data-rtab]'); if (rt){ state.tabs.research = rt.dataset.rtab; state.tabs.tdk = 'any'; state.tdHl = rt.dataset.hl; OPEN.add('tdw' + hsh('td' + rt.getAttribute('href').slice(3) + 'any' + rt.dataset.hl)); }
  const ps = e.target.closest('[data-pos]'); if (ps){ state.ppos = ps.dataset.pos; renderPlayers(); return; }
  if (e.target.closest('#openSearch')){ if (location.hash === '#players') $('#psearch')?.focus(); else { state.focusSearch = true; location.hash = '#players'; } return; }
  if (e.target.id === 'drawer') closePlayer();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && SCHED.next && Date.now() > SCHED.next){ if (isWeek()) loadWeek(true); else reload(true); } });
CONFIG.sgpPerTier = store.get('np_sgpN', CONFIG.sgpPerTier);
setInterval(maintenance, 30*60000); setTimeout(maintenance, 20000);
headerSync(); route(); reload(false);
